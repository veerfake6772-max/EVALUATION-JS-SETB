

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <form action="">
            <h3>Register Here</h3>
            <br>
            Name:
            <input type="text" id="name">
            <br>
            Email: 
            <input type="email" id="email" value="">
            <br>
            Password:
            <input type="password" id="pass">
            <br>
            <button type="button" id="btn">Submit</button>
        </form>
        
    </body>

    <script >






            const b1 = document.getElementById("btn");
            b1.addEventListener('click', ()=>{
                const pname = document.getElementById("name").value
                const pemail = document.getElementById("email").value
                const pass = document.getElementById("pass").value

                const nameReg =  /^[A-Za-z\s]+$/;
                const passReg = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@#$_]).{8,}$/;
                if (!nameReg.test(pname)) {
                    alert("Invalid Name");
                } else if(!passReg.test(pass)){
                    alert ("Enter Valid Password")
                }else{
                    alert("Register Success")
                }

                localStorage.setItem("PatientDetails", JSON.stringify({pname,pemail,pass}))
            });


const data = localStorage.getItem(JSON.parse("PatientDetails"))
            console.log(data.pname);
            console.log(data.pemail);
            
            


        </script>
</html>
