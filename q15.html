<body>
    <p>Appointment Counter <span id="count"> </span></p>
    <button id="click" onclick="inc()">Click</button>

    <button id="click1" onclick="dec()">Click</button>
    <button id="resetbtn" onclick="reset()">reset</button>
    <script>
        let counter = 0;
        function inc() {
            counter++;
            document.getElementById("count").innerText = counter;
        }
         function dec() {
            counter--;
            document.getElementById("count").innerText = counter;
        }
        function reset() {
            counter = 0;
            document.getElementById("count").innerText = counter;

        }

    </script>
</body>

</html>
